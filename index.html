<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-time Sign Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.16.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  </head>
  <body class="bg-gradient-to-b from-slate-100 to-slate-300 text-slate-800 h-screen flex flex-col justify-center items-center">
      <section class="bg-white w-fit p-8 rounded-2xl shadow-lg text-center">
        <h1 class="text-3xl font-bold mb-8">Signify</h1>
        <div class="flex gap-8 items-start">
          <div>
          <div class="relative w-full max-w-[480px] mx-auto aspect-[4/3] overflow-hidden rounded-2xl border border-slate-200 shadow">
            <video id="webcam" autoplay playsinline class="w-full h-full object-cover bg-slate-200 rounded-2xl"></video>
            <canvas id="output_canvas" width="480" height="320" class="absolute top-0 left-0 w-full h-full pointer-events-none"></canvas>
            <div id="loadingIndicator" class="absolute inset-0 flex items-center justify-center bg-white/70 text-blue-600 font-semibold text-lg">
              Loading camera...
            </div>
          </div> 

          <p id="gesture_output" class="hidden text-lg font-semibold text-gray-700 mt-4">
          <p id="object_output" class="hidden text-lg font-semibold text-gray-700 mt-4">
          <div id="input_text"></div>

          <div class="mt-6 flex justify-center gap-4">
            <button id="webcamButton" class="bg-blue-700 text-white font-medium py-3 px-6 rounded-xl hover:bg-blue-500 transition transform hover:-translate-y-0.5 disabled:bg-slate-300 disabled:cursor-not-allowed disabled:transform-none">
              Enable Camera
            </button>
            <button id="gestureButton" class="bg-green-700 text-white font-medium py-3 px-6 rounded-xl hover:bg-green-500 transition transform hover:-translate-y-0.5 disabled:bg-slate-300 disabled:cursor-not-allowed disabled:transform-none">
              Detect Gesture
            </button>
            <button id="objectButton" class="bg-red-700 text-white font-medium py-3 px-6 rounded-xl hover:bg-red-500 transition transform hover:-translate-y-0.5 disabled:bg-slate-300 disabled:cursor-not-allowed disabled:transform-none">
              Detect Object
            </button>
          </div>
         </div>

          <div id="gestureContainer" class="flex flex-col items-start justify-start w-[350px]" style="display: none;">
            <p class="text-2xl font-semibold text-gray-700"> Sign Language </p>
            <img id="signImage" src="./image/sign-language.jpg" alt="Sign Language Image" class="w-full object-cover rounded-2xl mt-4" />
          </div>

          <div id="objectContainer" class="flex flex-col items-start justify-start w-[350px]" style="display: none;">
            <p class="text-2xl font-semibold text-gray-700"> Object to Sign Language </p>
            <button id="generateSign" class="bg-red-700 text-white text-md mt-4 font-medium py-2 px-4 rounded-xl hover:bg-red-500 transition transform hover:-translate-y-0.5 disabled:bg-slate-300 disabled:cursor-not-allowed disabled:transform-none">
              Generate Sign Language
            </button>
            <div id="signImagesContainer" class="mt-8 items-center justify-center flex flex-wrap space-x-2">
              
            </div>
          </div>  
        </div>
      </section>

    <script type="module" src="./js/webcam.js"></script>
  </body>
</html>
